<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK 7 Live</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
</head>
<body>
    <div id="app">
        <h1>STACK 7 Live</h1>
        
        <!-- Setup-Bereich für Host und Spieler -->
        <section id="setup-section">
            <div class="card">
                <h2>Spiel beitreten / Hosten</h2>
                <div class="form-group">
                    <label for="username">Dein Name:</label>
                    <input type="text" id="username" placeholder="z.B. Adrian">
                </div>
                
                <div class="actions-grid">
                    <button id="btn-create-lobby" class="btn-primary">Spiel hosten (Raum erstellen)</button>
                </div>
                
                <div class="divider">ODER</div>
                
                <div class="form-group">
                    <label for="lobby-code-input">Raum-Code:</label>
                    <input type="number" maxlength="6" pattern="[0-9]{6}" id="lobby-code-input" placeholder="6-stelliger Code">
                </div>
                <button id="btn-join-lobby" class="btn-secondary">Raum beitreten</button>
            </div>
        </section>

        <!-- Live-Spielbereich -->
        <section id="game-section" class="hidden">
            <div class="room-info">
                <span>Raum-Code: <strong id="display-room-code">-</strong></span>
                <span id="host-badge" class="badge hidden">Du bist der Host</span>
            </div>

            <!-- Globaler Spielstatus (Gemeinsamer Topf & Turm) -->
            <div class="card global-status-card">
                <div class="status-grid">
                    <div class="status-item">
                        <small>Gemeinsamer Pot</small>
                        <span id="global-pot">0</span> <small>Chips</small>
                    </div>
                    <div class="status-item">
                        <small>Aktuelle Turmhöhe</small>
                        <span id="tower-height">0</span> <small>/ 21</small>
                    </div>
                </div>
                <!-- Checkpoint Anzeige -->
                <div id="checkpoint-alert" class="checkpoint-banner hidden">
                    ⚠️ CHECKPOINT ERREICHT! CASH OUT oder STAY?
                </div>
                <!-- Host-Steuerung für Turm-Resets -->
                <div id="host-controls" class="hidden">
                    <button id="btn-reset-tower" class="btn-danger-small">💥 Turm eingestürzt / Reset</button>
                </div>
            </div>

            <!-- Eigene Punkte- & Spielsteuerung -->
            <div class="card my-score-card">
                <h2>Deine Chips: <span id="my-chips">20</span></h2>
                <div class="game-action-label">Chip-Aktionen (Ändert dein Kapital):</div>
                <div class="score-buttons">
                    <button id="btn-score-1">+1</button>
                    <button id="btn-score-7">+7</button>
                    <button id="btn-score-2">-2</button>
                </div>
                
                <div class="game-action-label" style="margin-top: 15px;">Spiel-Züge (Chips in den Pot legen & Turm erhöhen):</div>
                <div class="score-buttons">
                    <button id="btn-place-1" class="btn-game-action">1 in Pot</button>
                    <button id="btn-place-2" class="btn-game-action">2 in Pot</button>
                    <button id="btn-place-3" class="btn-game-action">3 in Pot</button>
                </div>
            </div>

            <!-- Live-Rangliste aller Spieler im Raum -->
            <div class="card">
                <h2>Mitspieler im Raum</h2>
                <ul id="players-list"></ul>
            </div>
        </section>
    </div>
</body>
</html>
