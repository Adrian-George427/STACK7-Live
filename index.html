<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK 7 Live</title>
    <link rel="stylesheet" href="index.css">
    <!-- index.js als Modul einbinden -->
    <script type="module" src="index.js"></script>
</head>
<body>
    <div id="app">
        <h1>STACK 7 Live</h1>
        
        <!-- Setup-Bereich für Host und Spieler -->
        <section id="setup-section">
            <div class="card">
                <h2>Spiel beitreten / Hosten</h2>
                <div class="form-group">
                    <label for="username">Dein Name:</label>
                    <input type="text" id="username" placeholder="z.B. Adrian">
                </div>
                
                <div class="actions-grid">
                    <button id="btn-create-lobby" class="btn-primary">Spiel hosten (Raum erstellen)</button>
                </div>
                
                <div class="divider">ODER</div>
                
                <div class="form-group">
                    <label for="lobby-code-input">Raum-Code:</label>
                    <input type="text" id="lobby-code-input" placeholder="4-stelliger Code">
                </div>
                <button id="btn-join-lobby" class="btn-secondary">Raum beitreten</button>
            </div>
        </section>

        <!-- Live-Spielbereich -->
        <section id="game-section" class="hidden">
            <div class="room-info">
                <span>Raum-Code: <strong id="display-room-code">-</strong></span>
                <span id="host-badge" class="badge hidden">Du bist der Host</span>
            </div>

            <!-- Eigene Punkte-Steuerung für jeden Spieler -->
            <div class="card my-score-card">
                <h2>Deine Chips: <span id="my-chips">20</span></h2>
                <div class="score-buttons">
                    <button id="btn-score-1">+1</button>
                    <button id="btn-score-7">+7</button>
                    <button id="btn-score-2">-2</button>
                </div>
            </div>

            <!-- Live-Rangliste aller Spieler im Raum -->
            <div class="card">
                <h2>Mitspieler im Raum</h2>
                <ul id="players-list">
                    <!-- Wird dynamisch durch index.js befüllt -->
                </ul>
            </div>
        </section>
    </div>
</body>
</html>
